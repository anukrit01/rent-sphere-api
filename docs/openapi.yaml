        endDate:
          type: string
          format: date-time
        projectLocation:
          type: string
        projectDescription:
          type: string
        operatorRequired:
          type: boolean
          default: false
        deliveryRequired:
          type: boolean
          default: false

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        durationDays:
          type: integer
        dailyRate:
          type: number
        rentalSubtotal:
          type: number
        operatorFee:
