                renters:
                  type: integer
                leasers:
                  type: integer
                admins:
                  type: integer
                active:
                  type: integer
            assets:
              type: object
              properties:
                total:
                  type: integer
                available:
                  type: integer
                pendingReview:
                  type: integer
                rented:
                  type: integer
            bookings:
              type: object
              properties:
                total:
                  type: integer
                active:
                  type: integer
                completed:
